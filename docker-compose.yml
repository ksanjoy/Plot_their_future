# Local / single-host stack: MongoDB (replica set), Redis, API (with workers) and the web app.
#   cp backend/.env.example backend/.env
#   docker compose up --build -d
#   docker compose --profile tools run --rm seed      # optional demo data
# See docs/DEPLOYMENT.md for production settings (MongoDB Atlas).
name: plot-their-future

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { if (rs.status().ok) quit(0); } catch (e) {} rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}); quit(1)",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ./backend, target: runtime }
    env_file: ./backend/.env
    environment:
      # The image defaults to production, which refuses the mock payment provider.
      # Set NODE_ENV=production with real Razorpay/WhatsApp credentials when deploying.
      NODE_ENV: ${API_NODE_ENV:-development}
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ptf?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/uploads
    ports: ["5000:5000"]
    volumes: [uploads:/app/uploads]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./frontend/web
      args:
        # Baked into the browser bundle: must be the API URL as seen from the browser.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  seed:
    profiles: [tools]
    build: { context: ./backend, target: build }
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/ptf?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    command: ["pnpm", "db:seed"]
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongodata:
  redisdata:
  uploads:
